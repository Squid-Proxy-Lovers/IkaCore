[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squidagent"
version = "0.1"
authors = [
  { name="idk", email="idk@gmail.com" },
]
description = "SPL Multi-agent: Autonomous LLM agents for solving CTFs"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
  "pathlib",
  "openai",
  "anthropic",
  "rich",
  "pyyaml",
#  "bs4",
#  "jinja2",
  "docker",
  "tabulate",
  "backoff",
  "pyte",
  "tiktoken",
  "nyuctf",
  "google-generativeai"
]
