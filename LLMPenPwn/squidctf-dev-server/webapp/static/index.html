<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SquidAgent</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              600: '#16a34a'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100">
  <div class="max-w-6xl mx-auto px-4 py-6">
    <h1 class="text-3xl font-semibold tracking-tight mb-6">SquidAgent</h1>

    <section class="rounded-lg border border-slate-700 bg-slate-800/50 p-4 mb-4">
      <h2 class="text-xl font-medium mb-3">Add Challenge</h2>
      <form id="addChallengeForm" class="space-y-3">
        <div class="flex flex-wrap items-center gap-3">
          <label class="min-w-36 text-slate-300">Challenge Name</label>
          <input required id="challengeId" placeholder="unique_name" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 w-64" />
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <label class="min-w-36 text-slate-300">Category</label>
          <select id="category" class="bg-slate-900 border border-slate-700 rounded px-3 py-2 w-44">
            <option value="rev">rev</option>
            <option value="pwn">pwn</option>
            <option value="crypto">crypto</option>
            <option value="web">web</option>
            <option value="forensics">forensics</option>
            <option value="misc">misc</option>
          </select>
        </div>
        <div class="flex flex-wrap items-start gap-3">
          <label class="min-w-36 text-slate-300 mt-2">Description</label>
          <textarea id="description" rows="3" placeholder="Optional challenge description"
            class="bg-slate-900 border border-slate-700 rounded px-3 py-2 w-[32rem]"></textarea>
        </div>
        <div class="flex flex-wrap items-center gap-3">
          <label class="min-w-36 text-slate-300">Upload files</label>
          <input type="file" id="files" multiple class="text-slate-200" />
        </div>
        <button type="submit" class="px-3 py-2 rounded bg-brand-600 hover:brightness-110 text-white">Add</button>
      </form>
    </section>

    <section class="rounded-lg border border-slate-700 bg-slate-800/50 p-4 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xl font-medium">Challenges</h2>
        <button id="refreshChallenges" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600">Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table id="challengesTable" class="min-w-full text-sm">
          <thead class="bg-slate-800">
            <tr>
              <th class="px-3 py-2 text-left border-b border-slate-700">Name</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Category</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Path</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Run</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>

    <section class="rounded-lg border border-slate-700 bg-slate-800/50 p-4">
      <h2 class="text-xl font-medium mb-3">Runs</h2>
      <div class="overflow-x-auto">
        <table id="statusTable" class="min-w-full text-sm">
          <thead class="bg-slate-800">
            <tr>
              <th class="px-3 py-2 text-left border-b border-slate-700">Challenge</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Status</th>
              <th class="px-3 py-2 text-left border-slate-700">Step</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Result</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Restarts</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>

    <section class="rounded-lg border border-slate-700 bg-slate-800/50 p-4 mt-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xl font-medium">Captured Flags</h2>
        <button id="refreshFlags" class="px-3 py-2 rounded bg-slate-700 hover:bg-slate-600">Refresh</button>
      </div>
      <div class="overflow-x-auto">
        <table id="flagsTable" class="min-w-full text-sm">
          <thead class="bg-slate-800">
            <tr>
              <th class="px-3 py-2 text-left border-b border-slate-700">Challenge</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Flag</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Success</th>
              <th class="px-3 py-2 text-left border-b border-slate-700">Finished</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-800"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="logModal" class="fixed inset-0 bg-black/60 hidden">
    <div class="bg-slate-900 border border-slate-700 rounded-lg shadow-xl w-[95vw] max-w-5xl h-[85vh] max-h-[90vh] mx-auto mt-8 flex flex-col">
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-700">
        <div class="flex items-center gap-4">
          <strong id="logTitle" class="text-lg">Log</strong>
          <label class="text-slate-300 text-sm flex items-center gap-2"><input type="checkbox" id="autoScroll" checked class="accent-brand-600" /> Auto-scroll</label>
        </div>
        <button id="closeLog" class="px-3 py-1.5 rounded bg-slate-700 hover:bg-slate-600">Close</button>
      </div>
      <div class="flex-1 overflow-auto bg-black">
        <pre id="logPre" class="m-0 p-3 text-slate-100 text-xs font-mono whitespace-pre-wrap"></pre>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      window.SquidUI.init();
    });
  </script>
</body>
</html>
