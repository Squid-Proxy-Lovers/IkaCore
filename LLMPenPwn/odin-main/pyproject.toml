[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odin"
version = "0.0.1"
description = "Attack & Defense LLM Orchestration Engine"
requires-python = ">=3.11"
dependencies = [
    "pyyaml==6.0.2",
    "openai==1.108.1",
    "docker==7.1.0",
    "websocket-client==1.8.0",
    "portkey-ai>=1.0.0",
    "anthropic>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["odin*"]

[project.scripts]
odin = "odin.cli:main"