name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.python-version }}, httpx ${{ matrix.httpx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: "3.11", httpx: current}
          - {python-version: "3.12", httpx: current}
          - {python-version: "3.13", httpx: current}
          - {python-version: "3.11", httpx: "0.27.0"}
          - {python-version: "3.12", httpx: "0.27.0"}
          - {python-version: "3.13", httpx: "0.27.0"}
    env:
      IKACORE_LIVE_PROVIDER_TESTS: "0"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,dev]"
      - if: matrix.httpx != 'current'
        run: python -m pip install "httpx==${{ matrix.httpx }}"
      - run: python scripts/quality.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-${{ matrix.python-version }}-${{ matrix.httpx }}
          path: artifacts/quality/
          retention-days: 7

  benchmarks:
    name: offline benchmarks
    needs: quality
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-3.11-current
          path: artifacts/quality/
      - name: Install only the wheel and runtime dependencies
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/ika-runtime"
          python -m pip --python "$RUNNER_TEMP/ika-runtime/bin/python" install artifacts/quality/*.whl
      - name: Benchmark offline and check footprint budgets
        run: |
          python scripts/benchmark.py --python "$RUNNER_TEMP/ika-runtime/bin/python" \
            --wheel artifacts/quality/*.whl \
            --samples 3 --iterations 20 --soak-iterations 250
          "$RUNNER_TEMP/ika-runtime/bin/python" scripts/provider_benchmark.py \
            --output artifacts/benchmarks/providers.json --iterations 100
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: offline-benchmarks-linux-3.11
          path: artifacts/benchmarks/
          retention-days: 7
