[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ikacore"
version = "0.0.0"
description = "IkaCore agent framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "IkaCore contributors"},
]
dependencies = [
  "httpx>=0.27,<1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "pyright>=1.1.390",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["IkaCore*", "IkaModel*", "IkaMem*"]
namespaces = true

[tool.setuptools.package-data]
IkaModel = ["summary_prompt", "prompts/*.txt", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["src/IkaTest"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/IkaTest/test_agent_helpers.py" = ["E402"]
"src/IkaTest/test_agent_tools_api.py" = ["E402"]
"src/IkaTest/test_hitl_interrupt_resume.py" = ["E402"]
"src/IkaTest/test_ika_base_agent.py" = ["E402"]
"src/IkaTest/test_workflow_semantics.py" = ["E402"]

[tool.pyright]
include = ["src/IkaCore", "src/IkaModel", "src/IkaMem"]
exclude = ["src/IkaTest", "examples"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportUnsupportedDunderAll = "none"
# Static gate: enforce import/name, return, assignment, argument, call-shape,
# optional, iterable, and attribute-access checks. Stub availability remains
# staged because optional provider integrations do not all ship type stubs.
reportAttributeAccessIssue = "error"
reportArgumentType = "error"
reportAssignmentType = "error"
reportCallIssue = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalMemberAccess = "error"
reportReturnType = "error"

[tool.coverage.run]
branch = true
source = ["IkaCore", "IkaModel", "IkaMem"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 91
