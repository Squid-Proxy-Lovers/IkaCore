[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ikacore"
version = "0.0.0"
description = "IkaCore agent framework"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "IkaCore contributors"},
]
dependencies = [
  "httpx>=0.27,<1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["IkaCore*", "IkaModel*", "IkaMem*"]
namespaces = true

[tool.setuptools.package-data]
IkaModel = ["summary_prompt", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["src/IkaTest"]
pythonpath = ["src"]
