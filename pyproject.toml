[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ikacore"
version = "2.0.0"
description = "IkaCore agent framework"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [
  {name = "IkaCore contributors"},
]
dependencies = [
  "httpx>=0.27,<1",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Squid-Proxy-Lovers/IkaCore"
Issues = "https://github.com/Squid-Proxy-Lovers/IkaCore/issues"
Documentation = "https://github.com/Squid-Proxy-Lovers/IkaCore/blob/main/docs/USAGE.md"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
dev = [
  "setuptools>=77.0.3",
  "wheel",
  "pyright>=1.1.390",
  "ruff>=0.16.10",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["IkaCore*", "IkaModel*", "IkaMem*"]
namespaces = true

[tool.setuptools.package-data]
IkaCore = ["py.typed"]
IkaModel = ["py.typed", "summary_prompt", "prompts/*.txt", "data/*.json"]
IkaMem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["src/IkaTest"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "I001", "B", "C4", "PIE", "ASYNC", "C90",
  "RUF006", "RUF008", "RUF012", "RUF013", "RUF021", "RUF043", "RUF059", "RUF100",
]
# Constant getattr/setattr support typed internal adapters; async timeout arguments
# are part of the API; typed lambda factories preserve Pyright's generic inference.
ignore = ["E501", "B009", "B010", "ASYNC109", "PIE807"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/IkaTest/test_agent_helpers.py" = ["E402"]
"src/IkaTest/test_agent_tools_api.py" = ["E402"]
"src/IkaTest/test_hitl_interrupt_resume.py" = ["E402"]
"src/IkaTest/test_ika_base_agent.py" = ["E402"]
"src/IkaTest/test_workflow_semantics.py" = ["E402"]

[tool.pyright]
include = ["src/IkaCore", "src/IkaModel", "src/IkaMem", "examples"]
exclude = ["src/IkaTest"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportUnsupportedDunderAll = "none"
# Static gate: enforce import/name, return, assignment, argument, call-shape,
# optional, iterable, and attribute-access checks. Stub availability remains
# staged because optional provider integrations do not all ship type stubs.
reportAttributeAccessIssue = "error"
reportArgumentType = "error"
reportAssignmentType = "error"
reportCallIssue = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalMemberAccess = "error"
reportReturnType = "error"

[tool.coverage.run]
branch = true
source = ["IkaCore", "IkaModel", "IkaMem"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 91

[tool.coverage.json]
show_contexts = true
